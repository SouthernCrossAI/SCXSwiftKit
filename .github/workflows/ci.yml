name: CI

on:
  pull_request:

jobs:
  build-and-unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Newest installed Xcode; picks up Xcode 27 when the image has it,
      # on Xcode 26 the Foundation Models provider compiles out and the
      # package still builds (see README).
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
      - run: swift --version
      - run: swift build
      - run: swift test --filter SCXRuntimeTests

  provider-tests:
    # Xcode 27 preview image: compiles the provider in and runs the simulator tests.
    # The live tests against api.scx.ai skip unless the SCX_API_KEY secret is set.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SCX_API_KEY: ${{ secrets.SCX_API_KEY }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: SCX key for live tests
        if: env.SCX_API_KEY != ''
        run: mkdir -p ~/.config/scx && printf '%s' "$SCX_API_KEY" > ~/.config/scx/api_key
      - name: Pick an iOS 27 iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS-27")) | .value[] | select(.name | test("^iPhone")) | .udid' \
            | head -n 1)
          test -n "$UDID"
          echo "SCX_CI_DESTINATION=id=$UDID" >> "$GITHUB_ENV"
      - run: Scripts/ci.sh
